steps:
  # 1. Build the container image using the Dockerfile inside the server folder
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/nc-investment-backend:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/nc-investment-backend:latest',
      '-f', 'server/Dockerfile',
      'server'
    ]

  # 2. Push the built container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nc-investment-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nc-investment-backend:latest']

  # 3. Deploy the container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nc-investment-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nc-investment-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Note: Database connection string and secrets will be configured in Cloud Run environment variables.

images:
  - 'gcr.io/$PROJECT_ID/nc-investment-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/nc-investment-backend:latest'
